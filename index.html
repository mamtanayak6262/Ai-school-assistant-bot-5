
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS AI - Smart Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#080d1b;
  color:white;
  height:100vh;
  display:flex;
  overflow:hidden;
}
.sidebar{
  width:260px;background:#10182a;padding:20px;
  display:flex;flex-direction:column;gap:15px;
}
.logo{font-size:27px;font-weight:bold;color:#38bdf8}
.newchat,button{
  background:linear-gradient(120deg,#2563eb,#06b6d4);
  color:white;border:0;padding:12px;border-radius:10px;
  cursor:pointer;font-size:14px;
}
.sidebar p{color:#94a3b8;font-size:13px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{
  padding:18px 24px;background:#10182a;
  border-bottom:1px solid #25314a;
  display:flex;justify-content:space-between;align-items:center;
}
header h2{font-size:21px}
header span{color:#38bdf8}
.settings{padding:15px;background:#10182a;border-radius:12px}
.settings input,.settings select{
  width:100%;padding:10px;margin-top:8px;
  background:#080d1b;border:1px solid #334155;
  color:white;border-radius:8px;
}
.chat{
  flex:1;overflow-y:auto;padding:25px;
  display:flex;flex-direction:column;gap:18px;
}
.message{
  padding:14px 17px;border-radius:14px;
  max-width:80%;line-height:1.6;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.user{background:#1d4ed8;align-self:flex-end}
.bot{background:#17243a;align-self:flex-start}
.welcome{text-align:center;margin:auto;color:#cbd5e1}
.welcome h1{font-size:36px;color:#38bdf8;margin-bottom:12px}
.welcome p{color:#94a3b8}
.input-area{
  padding:18px 24px;background:#10182a;
  border-top:1px solid #25314a;
}
.input-box{
  display:flex;gap:10px;max-width:950px;margin:auto;
}
.input-box textarea{
  flex:1;resize:none;height:55px;max-height:130px;
  background:#080d1b;color:white;border:1px solid #334155;
  padding:16px;border-radius:12px;font-size:15px;
  outline:none;
}
.input-box button{width:90px}
.hint{text-align:center;color:#64748b;font-size:11px;margin-top:10px}
@media(max-width:650px){
  .sidebar{width:75px;padding:10px}
  .sidebar .side-text{display:none}
  .logo{font-size:17px}
  header{padding:15px}
  .chat{padding:15px}
  .message{max-width:95%}
  .input-area{padding:12px}
  .input-box button{width:65px}
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">⚡ BOSS AI</div>
  <button class="newchat" onclick="newChat()">+ <span class="side-text">New Chat</span></button>
  <div class="settings">
    <p class="side-text">GROQ API KEY</p>
    <input id="apiKey" type="password" placeholder="Enter Groq API Key">
    <p class="side-text" style="margin-top:12px">AI MODEL</p>
    <select id="model">
      <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
      <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
      <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
      <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
    </select>
  </div>
  <button onclick="clearChat()">Clear Chat</button>
  <p class="side-text">Your personal AI assistant.</p>
</aside>

<main class="main">
  <header>
    <h2>⚡ <span>BOSS AI</span></h2>
    <small>AI Assistant</small>
  </header>

  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h1>Welcome to BOSS AI</h1>
      <p>Ask anything. Learn anything. Create anything.</p>
    </div>
  </section>

  <div class="input-area">
    <div class="input-box">
      <textarea id="prompt" placeholder="Message BOSS AI..."></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send ➤</button>
    </div>
    <div class="hint">BOSS AI can make mistakes. Verify important information.</div>
  </div>
</main>

<script>
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

let messages = [];

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}

function newChat(){
  messages=[];
  chat.innerHTML=`
    <div class="welcome" id="welcome">
      <h1>Welcome to BOSS AI</h1>
      <p>Ask anything. Learn anything. Create anything.</p>
    </div>`;
}

function clearChat(){
  newChat();
}

async function sendMessage(){
  const text=promptBox.value.trim();
  const apiKey=document.getElementById("apiKey").value.trim();
  const model=document.getElementById("model").value;

  if(!text)return;
  if(!apiKey){
    alert("Please enter your Groq API Key first!");
    return;
  }

  const welcome=document.getElementById("welcome");
  if(welcome) welcome.remove();

  promptBox.value="";
  addMessage(text,"user");

  messages.push({role:"user",content:text});

  sendBtn.disabled=true;
  sendBtn.textContent="...";

  const loading=addMessage("BOSS AI is thinking...","bot");

  try{
    const response=await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer "+apiKey
        },
        body:JSON.stringify({
          model:model,
          messages:[
            {
              role:"system",
              content:"You are BOSS AI, a helpful, friendly and intelligent assistant. Answer clearly and help users learn. Reply in the language used by the user."
            },
            ...messages
          ],
          temperature:0.7,
          max_completion_tokens:2048
        })
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error?.message || "API request failed");
    }

    const answer=data.choices?.[0]?.message?.content;
    if(!answer) throw new Error("No answer received.");

    messages.push({role:"assistant",content:answer});
    loading.textContent=answer;

  }catch(error){
    loading.textContent="Error: "+error.message;
  }finally{
    sendBtn.disabled=false;
    sendBtn.textContent="Send ➤";
    promptBox.focus();
  }
}

promptBox.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
